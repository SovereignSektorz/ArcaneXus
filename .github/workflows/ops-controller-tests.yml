name: Operations Controller Tests
on:
  pull_request:
    paths:
      - 'tools/ax_ops.py'
      - 'termux/ax'
      - 'tests/**'
      - 'docs/operations-controller.md'
      - '.github/workflows/ops-controller-tests.yml'
  push:
    branches: [main, ops-controller-v1]
    paths:
      - 'tools/ax_ops.py'
      - 'termux/ax'
      - 'tests/**'
      - 'docs/operations-controller.md'
      - '.github/workflows/ops-controller-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Test operations controller
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check Termux launcher syntax
        run: bash -n termux/ax
      - name: Check controller syntax
        run: python -m py_compile tools/ax_ops.py
