name: Build ArcaneXus APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Install Flet
        run: pip install flet requests
        
      - name: Compile APK
        run: flet build apk --yes --module-name arcanexus_app.py --project ArcaneXus --org com.sovereignsektorz.arcanexus
        
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArcaneXus-Android-App
          path: build/apk/
